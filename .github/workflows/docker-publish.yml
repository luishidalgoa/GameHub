name: Build & publish Docker image

# Builds the production image for the Raspberry Pi (linux/arm64) and pushes it
# to GitHub Container Registry (GHCR), then publishes a GitHub Release.
#
# IMPORTANT: this does NOT run on every push to main. It runs only when you
# declare a public version by pushing a tag `vX.Y.Z` (see RELEASING below), or
# when you trigger it manually from the Actions tab. The Pi then just
# `docker compose pull`s the image — no building on the device.
# See docs/deployment/ci-registry.md.
#
#   RELEASING — to cut a public version:
#     npm version <patch|minor|major>     # bumps package.json + creates the v<x.y.z> tag
#     git push --follow-tags              # pushes the commit AND the tag → triggers this workflow
#   (or by hand:  git tag v1.2.0 && git push origin v1.2.0)

on:
  push:
    tags: ['v*']                 # only version tags trigger a build — NOT plain pushes to main
  workflow_dispatch: {}          # allow manual test builds from the Actions tab

env:
  IMAGE: ghcr.io/luishidalgoa/gamehub

jobs:
  # Cada arquitectura se compila en su PROPIO runner nativo y se sube por digest,
  # sin etiquetas. Nada de QEMU: emular amd64 sobre un runner ARM tardaba mas de
  # los 30 min de presupuesto (la build de v2.14.0 se cancelo justo ahi), y ya
  # antes habia causado cuelgues aleatorios de 6 h. El manifiesto multi-arquitectura
  # lo ensambla despues el job `merge`.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # La version se calcula igual que en `merge`, para que la que queda grabada
      # en la imagen y la que etiqueta el manifiesto no puedan discrepar.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build & push por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.ts.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Cache separada por arquitectura: compartirla las hace pisarse.
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      # El digest llega como env var: "${digest#sha256:}" es expansion de bash y
      # no puede ir dentro de una expresion ${{ }} de GitHub.
      - name: Exportar el digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Subir el digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1

  # Une los digests de las dos arquitecturas en un unico manifiesto y le pone las
  # etiquetas publicas (incluida `latest`, que es la que pide docker-compose).
  merge:
    name: Publicar manifiesto multi-arquitectura
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Descargar digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: `latest` se pone en etiquetas semver limpias (vX.Y.Z) pero
          # NO en pre-releases (vX.Y.Z-rc.1), asi que una RC no se despliega sola.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch

      - name: Crear el manifiesto
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Comprobar que estan las dos arquitecturas
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' | tee /tmp/arches
          grep -q 'linux/arm64' /tmp/arches
          grep -q 'linux/amd64' /tmp/arches

  # Only on a version tag: publish a GitHub Release with auto-generated notes
  # and the pull instructions. The image itself lives in GHCR; the Release is the
  # human-facing changelog + pointer to the version.
  release:
    name: GitHub Release
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the GitHub Release
    steps:
      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true     # changelog from merged PRs / commits
          body: |
            ## 🐳 Docker image

            Published to GHCR for `linux/arm64`:

            ```bash
            docker pull ghcr.io/luishidalgoa/gamehub:${{ needs.merge.outputs.version }}
            # rolling tag Watchtower follows:
            docker pull ghcr.io/luishidalgoa/gamehub:latest
            ```

            On the Raspberry Pi the deploy is automatic — Watchtower picks up the
            new `:latest` within ~5 min. To apply it immediately: `./deploy.sh update`.
