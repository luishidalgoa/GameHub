services:
  gamehub:
    image: ghcr.io/luishidalgoa/gamehub:latest   # imagen construida por CI; ya no se compila en la Pi
    container_name: gamehub
    restart: unless-stopped

    # El Watchtower del host (servicio independiente en ~/services/watchtower)
    # auto-actualiza este contenedor cuando hay imagen nueva. Aquí solo se opta in.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

    env_file: .env.production

    ports:
      - "3001:3000"   # Apache2 proxies to this; don't expose publicly if using a reverse proxy

    volumes:
      # ── Persistent data ──────────────────────────────────────────────────────
      # SQLite database
      - ./data:/data

      # ── ROM directories ──────────────────────────────────────────────────────
      # Whole drives mounted at their root — the scanner reaches any subfolder.
      # Configure the actual per-platform paths in Admin → Settings.
      - type: bind
        source: /mnt
        target: /mnt
        read_only: true
        bind:
          propagation: rslave

    # Give Next.js time to flush in-flight requests and close the SQLite
    # connection before Docker kills the process during a redeploy.
    stop_grace_period: 30s

    # Docker marks the container healthy once the app is accepting requests.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/me >/dev/null 2>&1 || exit 1"]

# ── Auto-deploy ───────────────────────────────────────────────────────────────
# El Watchtower ya NO vive aquí: es un servicio compartido del host, en su propio
# repo (~/services/watchtower). Vigila por etiqueta, así que basta con el label de
# arriba. Ver ~/services/watchtower/README.md para desplegarlo/migrarlo.
